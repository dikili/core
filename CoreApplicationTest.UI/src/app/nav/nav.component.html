<nav class="navbar navbar-default">
  <div class="container">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" [routerLink]="['/home']" routerLinkActive="router-link-active" >Dating App</a>
    </div>
    <div id="navbar" class="navbar-collapse collapse" *ngIf="loggedIn()" >
      <ul class="nav navbar-nav">
        <li>
          <a [routerLink]="['/members']" routerLinkActive="router-link-active"  routerLinkActive="router-link-active"  >Matches</a>
        </li>
        <li>
          <a [routerLink]="['/lists']" routerLinkActive="router-link-active"  >Lists </a>
        </li>
        <li>
          <a [routerLink]="['/messages']" routerLinkActive="router-link-active" >Messages</a>
        </li>               
      </ul>
      
      <ul *ngIf="loggedIn()" class="nav navbar-nav navbar-right">
          <!-- <li><a (click)="logout()">Logout</a></li> -->
          <li>
            <img src="{{photoUrl}}" alt="">
          </li>
          <li class="dropdown" dropdown>
            <a (click)=false class="dropdown-toggle" data-toggle="dropdown" role="button" dropdownToggle  aria-haspopup="true" aria-expanded="false">Welcome {{ this.authService.decodedToken?.unique_name | titlecase }} <span class="caret"></span></a>
            <ul class="dropdown-menu" *dropdownMenu>
              <li><a [routerLink]="['/member/edit']" routerLinkActive="router-link-active" ><i class="fa fa-user"></i>Edit Profile</a></li>
              <li role="separator" class="divider"></li>
              <li><a (click)="logout()"><i class="fa fa-sign-out"></i>Logout</a></li>
            </ul>
          </li>
        </ul>


    </div><!--/.navbar-collapse -->
    <div>
        <form *ngIf="!loggedIn()" #loginForm="ngForm" class="navbar-form navbar-right" (ngSubmit)="login()">
            <div class="form-group">
              <input type="text" placeholder="Email" #username="ngModel" required [(ngModel)]="model.username" name="username" class="form-control">
            </div>
            <div class="form-group">
              <input type="password" placeholder="Password" #password="ngModel" required [(ngModel)]="model.password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">Sign in</button>
          </form>
    </div>
  </div>
</nav>
