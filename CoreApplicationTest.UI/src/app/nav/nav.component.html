<nav class="navbar navbar-expand-md navbar-custom">
  <div class="container">
    <div class="row">
    <!-- <a class="navbar-brand navregister" [routerLink]="['/home']">CW-NPW </a> -->
    <ul class="navbar-nav mr-auto">
        <li class="nav-item" routerLinkActive="active">
            <a class="button navregister" [routerLink]="['/news']">News</a>
            <i class="fa fa-newspaper-o"></i>
          </li>
      <li class="nav-item" routerLinkActive="active">
        <a class="button navregister" [routerLink]="['/members']">Members</a>
        <i class="fa fa-user-o"></i>
      </li>
      <li class="nav-item" routerLinkActive="active">
        <a class="button navregister" [routerLink]="['/jobs']">Jobs</a>
        <i class="fa fa-university"></i>
      </li>
      <li  class="nav-item" routerLinkActive="active">
        <a class="button navregister" [routerLink]="['/messages']">Message
        <i class="fa fa-comments"></i>
        <span *ngIf="isUnRead" class="button__badge"><i style="font-size: 0.7em">New</i></span>
      </a>
     
      </li>
       <!-- <li class="nav-item" routerLinkActive="active">
        <a class="nav-link navregister" [routerLink]="['/lists']">Posts</a>
      </li>  -->
      <!-- <li  class="nav-item" routerLinkActive="active">
          <a class="button navregister" [routerLink]="['/admin']">Events</a>
        </li>
        <li  class="nav-item" routerLinkActive="active">
            <a class="button navregister" [routerLink]="['/admin']">Yellow Pages</a>
          </li> -->
      <li *appHasRole="['Admin','Moderator']" class="nav-item" routerLinkActive="active">
        <a class="button navregister" [routerLink]="['/admin']">Admin</a>
      </li>
    </ul>

    <div *ngIf="loggedIn()" class="dropdown" dropdown>
      <span class="mr-1">
        <img src="{{photoUrl || '../../assets/user.png'}}" alt="">
      </span>
      <a class="dropdown-toggle text-light" dropdownToggle>
        Welcome {{authService.decodedToken?.unique_name | titlecase}}
      </a>

      <div class="dropdown-menu mt-3" *dropdownMenu>
        <a class="dropdown-item" [routerLink]="['/member/edit']">
          <i class="fa fa-user"></i> Edit Profile</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="logout()">
          <i class="fa fa-sign-out"></i> Logout</a>
      </div>
    </div>

    <form *ngIf="!loggedIn()" #loginForm="ngForm" class="form-inline my-2 my-lg-0" (ngSubmit)="login()">
      <input class="form-control mr-sm-2" type="text" name="username" placeholder="Username" required [(ngModel)]="model.username">
      <input class="form-control mr-sm-2" type="password" name="password" placeholder="Password" required [(ngModel)]="model.password">
      <button [disabled]="!loginForm.valid" class="btn btn-success my-2 my-sm-0" type="submit">Login</button>
      <button type="button" class="btn btn-success my-2 my-sm-0" (click)="openModal(register)">Register</button>
    </form>
  </div>
  </div>


</nav>

<ng-template #register>
    <div class="modal-header" style="background-color:orangered">
      <!-- <h4 class="modal-title pull-left">Modal</h4> -->
      <h2 class="text-md-center text-secondary">Register to CW-NPW Club!</h2>
      <button type="button" class="close pull-right" aria-label="Close" (click)="modalRef.hide()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body formbackground">
        <app-register (cancelRegister)="cancelRegister($event)"></app-register>
    </div>
  </ng-template>
