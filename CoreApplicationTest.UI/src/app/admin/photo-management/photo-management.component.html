<div class="row"> 
  <div class="col-sm-2" *ngFor="let photo of photos">
    <h4>{{photo.userName}}</h4>
    <img src="{{photo.url}}" class="img-thumbnail p-1" alt="photo.userName">

    <div class="text-centre">
      <button type="button" class="btn btn-sm btn-success mr-1" (click)="approvePhoto(photo.id)">
        Approve
      </button>
      <button type="button" class="btn btn-sm btn-danger" (click)="approvePhoto(photo.id)">
          Reject
        </button>
    </div>

  </div>
</div>
