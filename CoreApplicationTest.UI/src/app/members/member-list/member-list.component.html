</div>

  <form class="form-inline" #form="ngForm" (ngSubmit)="loadUsers()" novalidate>

      <div class="container">
          <div class="row">
              <div class="card">
                  <div class="card-body bg-light">
              <div class="form-group">
                  <label for="building"><b style="color: orangered">Search Canary Wharfians: </b></label>
                  <select class="form-control ml-1" style="width: 190px" id="building"
                    [(ngModel)]="userParams.building" name="building">
                    <option *ngFor="let building of buildingList" [value]="building.value">
                      {{building.display}}
                    </option>
                  </select>
                  <button type="submit" class="btn btn-primary" style="margin-left:10px">Apply Filters</button>
                <button type="button" class="btn btn-info" (click)="resetFilters()" style="margin-left:10px">
                    Reset Filter
                </button>
                </div>
                
                </div>
                </div>
          </div>
         
        </div>

    </form>
    <br>


<div class="row">
  <div *ngFor="let user of users" class="col-lg-2 col-md-3 col-sm-6">
    <app-member-card [user]="user"></app-member-card>
  </div>
</div>
</div>

<div class="d-flex justify-content-center">
<pagination
    [boundaryLinks]="true"
    [totalItems]="pagination.totalItems"
    [(ngModel)]="pagination.currentPage"
    [itemsPerPage]="pagination.itemsPerPage"
    (pageChanged)="pageChanged($event)"
  previousText="&lsaquo;" nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;">

</pagination>
</div>
