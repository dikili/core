<div class="container">
  <div class="row">
    <h1>Your Profile</h1>
  </div>
   <div class="row">
     <div class="col-sm-4">
        <div class="panel panel-default">
           <img  class="profile-image thumbnail" src="{{user.photoUrl}}" alt="{{user.knownAs}}">
           <div class="panel-body">
            <div>
              <strong>Location:</strong>
              <p>{{user.city}}, {{user?.country}}</p>
            </div>
            <div>
              <strong>Age:</strong>
              <p>{{user.age}}</p>
            </div>
            <div>
              <strong>Last Active:</strong>
              <p>{{user.lastActive}}</p>
            </div>
            <div>
              <strong>Member Since:</strong>
              <p>{{user.created}}</p>
            </div>
          </div>
          <div class="panel-footer">
              <div class="btn-group-justified">
                <div class="btn-group">
                  <button class="btn btn-primary">Like</button>
                </div>
                <div class="btn-group">
                  <button class="btn btn-success">Message</button>
                </div>
              </div>  
          
          </div>
          </div>
        
     </div>
   
     <div class="col-sm-8">
       <div class="tab-panel">
          <tabset class="member-tabset">
              <tab heading="Edit Profile">
                  <h4>Description</h4>
                 <textarea name="introduction" rows="6" class="form-control" [(ngModel)]="user.introduction"></textarea>
                  <h4>Looking For:</h4>
                  <textarea name="lookingFor" rows="6" class="form-control" [(ngModel)]="user.lookingFor"></textarea>
                  <h4>Interests</h4>
                  <textarea name="interests" rows="6" class="form-control" [(ngModel)]="user.interests"></textarea>
                  <div class="form-inline">
                    <label for="city">
                     City:
                    </label>
                     <input type="text" class="form-control" name="city" [(ngModel)]="user.city"/>
                     <label for="country">
                      Country:
                     </label>
                      <input type="text" class="form-control" name="country" [(ngModel)]="user.country"/>
                  </div>                 
              </tab>
              <tab heading="Edit Photos">
               <p>Edit photos will go here !</p>
              </tab>
             
            </tabset>
       </div>
     </div>
</div>
