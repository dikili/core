module.exports = "<!-- <div *ngIf=\"!registerMode\" class=\"text-center\">\n    <h1>Find your match</h1>\n    <p class=\"lead\">Come on in to view your matches... All you need to do is sign up!</p>\n    <div class=\"text-center\">\n      <button class=\"btn btn-primary btn-lg\" (click)=\"registerToggle()\" >Register</button>\n      <button class=\"btn btn-info btn-lg\">Learn More</button>\n    </div>\n  </div>\n  \n  <div *ngIf=\"registerMode\" class=\"container\">\n    <div class=\"col-md-4 col-md-offset-4\">\n      <app-register [ValuesFromHome]=\"values\" (cancelRegister)=\"cancelRegister($event)\"></app-register>\n    </div>\n  </div> -->\n\n  <div class=\"container mt-5\">\n    <div *ngIf=\"!registerMode\" style=\"text-align: center\">\n      <h1>Find your match</h1>\n      <p class=\"lead\">Come on in to view your matches... All you need to do is sign up!</p>\n      <div class=\"text-center\">\n        <button class=\"btn btn-primary btn-lg mr-2\" (click)=\"registerToggle()\">Register</button>\n        <button class=\"btn btn-info btn-lg\">Learn more</button>\n      </div>\n    </div>\n  \n    <div *ngIf=\"registerMode\" class=\"container\">\n      <div class=\"row justify-content-center\">\n        <div class=\"col-4\">\n          <app-register (cancelRegister)=\"cancelRegister($event)\"></app-register>\n        </div>\n      </div>\n    </div>\n  </div>\n  \n  "
