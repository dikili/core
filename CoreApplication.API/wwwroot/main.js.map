module.exports = "<!-- <div class=\"container\">\n<div class=\"row\">\n<div class=\"btn-group\">\n\n  <button class=\"btn btn-primary\" [(ngModel)]=\"likeParams\" btnRadio=\"Likers\" (click)=\"loadUsers()\">Members Who Like Me</button>\n  <button class=\"btn btn-primary\" [(ngModel)]=\"likeParams\" btnRadio=\"Likees\" (click)=\"loadUsers()\">Members I Liked</button>\n</div>\n\n</div>\n\n<h2>\n  {{likeParams === 'Likers' ? 'Members who like me' : 'Members who I\\'ve  liked'  }} : {{pagination.totalItems}}\n\n\n  </h2>\n\n  <div class=\"row equal\">\n      <div *ngFor=\"let user of users\" class=\"col-lg-2 col-md-3 col-sm-6\">\n         <app-member-card [user]=\"user\"></app-member-card>\n      </div>\n    </div>\n\n    <div class=\"text-center\">\n        <pagination [boundaryLinks]=\"true\" \n                    [totalItems]=\"pagination.totalItems\"\n                    [itemsPerPage]=\"pagination.itemsPerPage\" \n                    (pageChanged)=\"pageChanged($event)\"\n                    [(ngModel)]= \"pagination.currentPage\" \n                    class=\"pagination-sm\"\n                  previousText=\"&lsaquo;\" nextText=\"&rsaquo;\" firstText=\"&laquo;\" lastText=\"&raquo;\">\n       \n          </pagination>\n      </div>  \n</div> -->\n<div class=\"text-center mt-3\">\n  <h2>{{likeParams === 'Likers' ? 'Members who like me' : 'Members who I\\'ve Liked'}} : {{pagination.totalItems}}</h2>\n</div>\n\n<div class=\"container mt-3\">\n\n<div class=\"row\">\n  <div class=\"btn-group\">\n    <button class=\"btn btn-primary\" [(ngModel)]=\"likeParams\" btnRadio=\"Likers\" (click)=\"loadUsers()\">Members who like me</button>\n    <button class=\"btn btn-primary\" [(ngModel)]=\"likeParams\" btnRadio=\"Likees\" (click)=\"loadUsers()\">Members who I like</button>\n  </div>\n</div>\n\n<br>\n\n<div class=\"row\">\n  <div *ngFor=\"let user of users\" class=\"col-sm-6 col-md-4 col-lg-4 col-xl-2\">\n    <app-member-card [user]=\"user\"></app-member-card>\n  </div>\n</div>\n\n\n\n</div>\n\n<div class=\"d-flex justify-content-center\">\n<pagination [boundaryLinks]=\"true\" [totalItems]=\"pagination.totalItems\" [itemsPerPage]=\"pagination.itemsPerPage\" [(ngModel)]=\"pagination.currentPage\"\n  (pageChanged)=\"pageChanged($event)\" previousText=\"&lsaquo;\" nextText=\"&rsaquo;\" firstText=\"&laquo;\" lastText=\"&raquo;\"\n  >\n\n</pagination>\n</div>"
